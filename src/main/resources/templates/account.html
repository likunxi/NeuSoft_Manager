<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments :: top}"></header>
        <main class="content">
            <div class="page-h">
                <div>
                    <h2>账号设置</h2>
                    <p>本人可以改显示名、学号和密码。改权限要找更高一级的管理员，在用户详情里上调 / 下调。</p>
                </div>
            </div>
            <div class="hint-box" th:if="${ok}" th:text="${ok}">成功</div>
            <div class="account-grid">
                <div class="panel">
                    <h3>我的信息</h3>
                    <p class="muted">用户名 <strong th:text="${user.username}">name</strong> 不可改。当前角色 <strong th:text="${me.roleName}">角色</strong>。</p>
                    <form method="post" action="/account/profile">
                        <label class="muted">显示名</label>
                        <input class="field" name="displayName" th:value="${user.displayName}" required>
                        <label class="muted">学号</label>
                        <input class="field" name="studentNo" th:value="${user.studentNo}">
                        <button class="btn" style="margin-top:12px;">保存资料</button>
                    </form>
                </div>
                <div class="panel">
                    <h3>修改密码</h3>
                    <form method="post" action="/account/password">
                        <label class="muted">原密码</label>
                        <input class="field" type="password" name="oldPassword" required>
                        <label class="muted">新密码（至少 6 位）</label>
                        <input class="field" type="password" name="newPassword" required>
                        <button class="btn" style="margin-top:12px;">更新密码</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
