<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments :: top}"></header>
        <main class="content">
            <div class="page-h">
                <div>
                    <h2>用户管理</h2>
                    <p>E1-01：新建账号、按角色授权、停用后不能再登录。</p>
                </div>
            </div>
            <form class="form-row" method="post" action="/users">
                <input class="field" name="username" placeholder="用户名" required>
                <input class="field" name="displayName" placeholder="显示名" required>
                <input class="field" type="password" name="password" placeholder="密码至少 6 位" required>
                <select class="field" name="roleId">
                    <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.roleName}"></option>
                </select>
                <button class="btn">新建用户</button>
            </form>
            <form class="filters" method="get" action="/users">
                <input class="field" name="q" placeholder="搜用户名 / 显示名 / 学号" th:value="${userQuery}">
                <button class="btn ghost">筛选</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>用户名</th><th>显示名</th><th>学号</th><th>角色</th><th>状态</th><th></th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${users}">
                        <td th:text="${u.username}"></td>
                        <td th:text="${u.displayName}"></td>
                        <td th:text="${u.studentNo}"></td>
                        <td th:text="${roleNames.get(u.roleId)}"></td>
                        <td><span class="pill" th:classappend="${u.isActive == 1 ? 'done' : 'todo'}" th:text="${u.isActive == 1 ? '启用' : '停用'}">状态</span></td>
                        <td class="card-actions">
                            <a class="btn tiny" th:href="@{|/users/${u.id}|}">详情</a>
                            <form th:action="@{|/users/${u.id}/toggle|}" method="post">
                                <input type="hidden" name="active" th:value="${u.isActive == 1 ? 0 : 1}">
                                <button class="btn tiny ghost" type="submit"
                                        th:text="${u.isActive == 1 ? '停用' : '启用'}"></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${users.isEmpty()}">没有匹配的用户</div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
