<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments :: top}"></header>
        <main class="content">
            <div class="page-h">
                <div>
                    <h2 th:text="${project.name + ' · 状态时间轴'}">时间轴</h2>
                    <p>看见协作过程。故事、甘特、UML 按当前数据展示。AI 助手只生成建议，人审后才写回。</p>
                </div>
                <div class="card-actions">
                    <a class="btn ghost" th:href="@{/work}">任务看板</a>
                    <a class="btn ghost" th:href="@{|/projects/${project.id}/stories|}">故事看板</a>
                    <a class="btn ghost" th:href="@{|/projects/${project.id}/gantt|}">甘特图</a>
                    <a class="btn ghost" th:if="${me.has('board:view')}" th:href="@{|/projects/${project.id}/members|}">成员图</a>
                    <a class="btn ghost" th:href="@{|/projects/${project.id}/uml|}">UML</a>
                    <button type="button" class="btn" th:attr="data-ai-open=${project.id}">AI 助手</button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>时间</th><th>任务</th><th>从</th><th>到</th><th>操作人</th><th>备注</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="l : ${logs}">
                        <td th:text="${l.createdAt}"></td>
                        <td th:text="${taskTitles.get(l.taskId)}"></td>
                        <td th:text="${l.fromStatus}"></td>
                        <td th:text="${l.toStatus}"></td>
                        <td th:text="${userNames.get(l.operatorId)}"></td>
                        <td th:text="${l.remark}"></td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${logs.isEmpty()}">还没有状态变更记录</div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
