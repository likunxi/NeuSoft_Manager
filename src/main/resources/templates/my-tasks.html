<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments :: side}"></aside>
    <div class="workspace">
        <header th:replace="~{fragments :: top}"></header>
        <main class="content">
            <div class="page-h">
                <div>
                    <h2>我的任务</h2>
                    <p>只列出当前登录用户作为负责人的任务，方便成员更新自己的状态。</p>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr><th>所属项目</th><th>阶段</th><th>故事</th><th>标题</th><th>状态</th><th>更新</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${tasks}">
                        <td th:text="${projectNames.get(t.projectId)}">项目</td>
                        <td><span class="tag" th:text="${t.storyCode != null and #strings.startsWith(t.storyCode,'E2') ? '进阶2' : (t.storyCode != null and #strings.startsWith(t.storyCode,'E3') ? '进阶3' : '进阶1')}">阶段</span></td>
                        <td><span class="tag" th:text="${t.storyCode}">E1</span></td>
                        <td th:text="${t.title}">标题</td>
                        <td><span class="pill" th:classappend="${t.status}" th:text="${t.status == 'todo' ? '待办' : (t.status == 'doing' ? '进行中' : '已完成')}">状态</span></td>
                        <td>
                            <form class="form-row" style="margin:0;" th:action="@{|/tasks/${t.id}/status|}" method="post">
                                <input type="hidden" name="projectId" th:value="${t.projectId}">
                                <input type="hidden" name="back" value="mine">
                                <select name="status" class="field">
                                    <option value="todo" th:selected="${t.status == 'todo'}">待办</option>
                                    <option value="doing" th:selected="${t.status == 'doing'}">进行中</option>
                                    <option value="done" th:selected="${t.status == 'done'}">已完成</option>
                                </select>
                                <button class="btn tiny">更新</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="empty" th:if="${tasks.isEmpty()}">还没有分配给你的任务</div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
